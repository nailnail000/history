<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>히스토리 목업</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;background:#080b15;color:#fff}
body{
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%,rgba(22,57,91,.22),transparent 34%),
    radial-gradient(circle at 12% 80%,rgba(22,90,126,.12),transparent 25%),
    #080b15;
}
body:before{
  content:"";
  position:fixed;inset:0;pointer-events:none;opacity:.65;
  background-image:
    radial-gradient(circle at 7% 17%,#55cfff 0 1px,transparent 2px),
    radial-gradient(circle at 18% 73%,#328ab4 0 1px,transparent 2px),
    radial-gradient(circle at 31% 12%,#32677e 0 1px,transparent 2px),
    radial-gradient(circle at 47% 85%,#4ca7c5 0 1px,transparent 2px),
    radial-gradient(circle at 64% 20%,#4e9ab4 0 1px,transparent 2px),
    radial-gradient(circle at 78% 72%,#397e9d 0 1px,transparent 2px),
    radial-gradient(circle at 91% 28%,#4ca6c7 0 1px,transparent 2px);
}

.history-window{
  width:100%;height:100%;
  position:relative;overflow:hidden;
}
.title-bar{
  position:absolute;z-index:60;top:0;left:0;right:0;height:68px;
  display:flex;align-items:center;padding:0 24px;
  font-size:30px;font-weight:900;letter-spacing:-1px;
  background:linear-gradient(90deg,#123e78,#1d568e 55%,#153e70);
  border-bottom:2px solid #347bb1;
  box-shadow:0 4px 22px rgba(0,0,0,.45);
}
.timeline-area{
  position:absolute;left:0;right:0;top:68px;bottom:0;
  overflow:hidden;cursor:grab;touch-action:none;
}
.timeline-area.dragging{cursor:grabbing}
.timeline-track{
  position:absolute;top:35%;left:0;width:4600px;height:3px;
  transform:translateY(-1px);
  background:repeating-linear-gradient(90deg,#43d5ee 0 12px,transparent 12px 22px);
  opacity:.9;pointer-events:none;
  box-shadow:0 0 8px rgba(57,213,239,.45);
}
.nodes{
  position:absolute;left:0;top:0;width:4600px;height:100%;
  transition:transform .18s ease-out;
}
.node{
  position:absolute;width:270px;height:118px;
  transform:translate(-50%,-50%);
  border:2px solid #18c9d5;
  border-radius:10px;
  overflow:visible;
  background:#123c50;
  box-shadow:0 0 0 1px rgba(0,0,0,.7),0 0 18px rgba(22,214,226,.22);
  cursor:pointer;
  transition:transform .15s,filter .15s,box-shadow .15s;
}
.node:hover{
  transform:translate(-50%,-50%) scale(1.035);
  filter:brightness(1.15);
  box-shadow:0 0 0 1px #07131b,0 0 28px rgba(48,226,240,.48);
  z-index:20;
}
.node-image{
  position:absolute;inset:0 0 34px 0;border-radius:8px 8px 0 0;
  background:
    linear-gradient(135deg,rgba(9,39,53,.2),rgba(4,12,24,.75)),
    radial-gradient(circle at 70% 35%,rgba(75,220,204,.45),transparent 25%),
    linear-gradient(120deg,#163d4c,#1b6a72 48%,#0b2331);
  overflow:hidden;
}
.node-image:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(73,234,220,.16) 50%,transparent 70%);
}
.node-name{
  position:absolute;left:0;right:0;bottom:0;height:36px;
  display:flex;align-items:center;padding:0 14px;
  background:linear-gradient(90deg,rgba(5,15,24,.97),rgba(9,28,38,.92));
  font-size:17px;font-weight:800;color:#fff;
}
.node-status{
  position:absolute;right:9px;bottom:8px;font-size:18px;font-weight:900;
}
.node.locked{
  border-color:#70747d;
  background:#373b42;
  filter:grayscale(1);
  box-shadow:0 0 0 1px #15171b;
}
.node.locked .node-image{
  background:linear-gradient(135deg,#4b4e53,#202328);
}
.node.locked .node-name{color:#c2c5ca;background:rgba(25,27,30,.96)}
.node.locked:hover{filter:grayscale(.75) brightness(1.1);box-shadow:0 0 15px rgba(150,150,150,.2)}

.node.current{
  border-color:#ffd34e;
  box-shadow:0 0 0 1px #2b2107,0 0 30px rgba(255,210,61,.55);
}
.node.current .node-name{color:#ffd84e}
.node.current .node-status{color:#ffd84e}

.node-ornament{
  position:absolute;top:-9px;left:50%;width:18px;height:18px;
  transform:translateX(-50%) rotate(45deg);
  background:#101d2a;border:2px solid #53ddea;z-index:3;
}
.node.current .node-ornament{border-color:#ffd34e}
.node.locked .node-ornament{border-color:#8b8f96}

.arrow{
  position:absolute;z-index:55;top:35%;width:78px;height:130px;
  transform:translateY(-50%);border:0;background:none;padding:0;cursor:pointer;
}
.arrow.left{left:10px}.arrow.right{right:10px}
.arrow-shape{
  width:47px;height:112px;margin:auto;
  background:linear-gradient(90deg,#1c78a8,#4ed9ec);
  border:2px solid #0a2637;
  clip-path:polygon(42% 0,100% 0,66% 50%,100% 100%,42% 100%,0 50%);
  filter:drop-shadow(0 0 7px rgba(40,208,240,.38));
  transition:transform .12s,filter .12s;
}
.arrow.right .arrow-shape{transform:scaleX(-1)}
.arrow:hover .arrow-shape{filter:brightness(1.25) drop-shadow(0 0 12px rgba(40,208,240,.7));transform:scale(1.07)}
.arrow.right:hover .arrow-shape{transform:scaleX(-1) scale(1.07)}

.tooltip{
  position:fixed;z-index:100;width:285px;padding:14px 16px;
  background:rgba(8,14,23,.97);border:1px solid #4d829a;border-radius:7px;
  box-shadow:0 10px 30px rgba(0,0,0,.55);
  pointer-events:none;opacity:0;transform:translateY(5px);transition:.1s;
}
.tooltip.visible{opacity:1;transform:none}
.tooltip-name{font-size:18px;font-weight:900;color:#62dceb;margin-bottom:7px}
.tooltip-condition{font-size:14px;line-height:1.45;color:#d9dce1}
.tooltip-status{margin-top:8px;font-size:12px;font-weight:800}
.tooltip-status.unlocked{color:#62e0e5}.tooltip-status.locked{color:#aeb3bb}

.hint{
  position:absolute;left:50%;top:57%;
  transform:translateX(-50%);
  color:#77848f;font-size:13px;opacity:.8;pointer-events:none;
}

/* 상세정보 모달 */
.modal-backdrop{
  position:fixed;z-index:200;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(2,5,12,.72);backdrop-filter:blur(4px);
  opacity:0;visibility:hidden;transition:.18s;
}
.modal-backdrop.open{opacity:1;visibility:visible}
.modal{
  width:min(590px,88vw);max-height:88vh;overflow:auto;
  position:relative;padding:28px 34px 25px;
  border:1px solid #d1a83e;border-radius:15px;
  background:
    radial-gradient(circle at 50% 0,rgba(38,76,112,.28),transparent 35%),
    linear-gradient(145deg,#09131f,#050b14 70%);
  box-shadow:0 0 0 1px rgba(14,35,54,.9),0 18px 70px rgba(0,0,0,.75),0 0 30px rgba(255,197,49,.12);
  text-align:center;
}
.modal:before{
  content:"";position:absolute;inset:8px;border:1px solid rgba(50,112,153,.28);
  border-radius:10px;pointer-events:none;
}
.modal-title{position:relative;font-size:25px;font-weight:900;color:#ffd34e}
.modal-subtitle{position:relative;margin-top:4px;color:#5fc9dc;font-size:15px;font-weight:700}
.modal-image{
  position:relative;width:100%;height:205px;margin:16px 0 17px;border-radius:7px;
  overflow:hidden;border:1px solid #1b6587;
  background:
    radial-gradient(circle at 70% 45%,#d9f5e9 0 8%,#43c7ad 9% 15%,transparent 16%),
    radial-gradient(circle at 72% 45%,rgba(57,239,202,.4),transparent 25%),
    linear-gradient(125deg,#111d1c 0 25%,#263f38 26% 42%,#021329 43% 70%,#3a3520 71%);
}
.modal-image:before{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(55deg,transparent 0 48%,rgba(23,247,223,.75) 49% 49.5%,transparent 50%),
    linear-gradient(120deg,transparent 0 55%,rgba(0,225,255,.45) 55.5% 56%,transparent 56.5%),
    repeating-linear-gradient(0deg,transparent 0 28px,rgba(23,130,160,.18) 29px 30px);
}
.modal-image-label{
  position:absolute;left:18px;bottom:12px;font-size:12px;color:#83c8d6;
  background:rgba(0,0,0,.42);padding:4px 8px;border-radius:4px;
}
.modal-text{
  position:relative;color:#e5e6e7;font-size:15px;line-height:1.7;
  white-space:pre-line;margin:0 5px;
}
.modal-highlight{color:#ffd13e;font-weight:900}
.modal-red{color:#ff5555;font-weight:900}
.unlock-box{
  position:relative;text-align:left;margin-top:18px;padding:13px 14px;
  border-top:1px solid #236080;
  color:#dce1e5;font-size:13px;line-height:1.55;
}
.unlock-label{color:#aeb8c0;font-weight:800;margin-bottom:3px}
.close-btn{
  position:relative;margin-top:8px;width:200px;height:48px;
  color:#fff;font-size:17px;font-weight:900;cursor:pointer;
  border:2px solid #4bd4e6;
  background:linear-gradient(#267ca1,#185a7d);
  clip-path:polygon(10% 0,90% 0,100% 50%,90% 100%,10% 100%,0 50%);
  box-shadow:inset 0 0 15px rgba(111,229,245,.2),0 0 14px rgba(55,210,235,.22);
}
.close-btn:hover{filter:brightness(1.2)}

@media(max-width:800px){
  .title-bar{font-size:23px;height:58px}
  .timeline-area{top:58px}
  .node{width:220px;height:100px}
  .node-name{font-size:14px}
  .modal{padding:23px 20px 20px}.modal-image{height:160px}.modal-title{font-size:21px}
}
</style>
</head>
<body>
<div class="history-window">
  <div class="title-bar">히스토리 목업</div>

  <div class="timeline-area" id="timelineArea">
    <div class="timeline-track"></div>
    <div class="nodes" id="nodes">

      <!-- 1장 -->
      <div class="node" data-x="190" style="left:190px;top:35%"
           data-name="1장 - 낯선 신호"
           data-condition="처음부터 해금"
           data-title="1장 - 낯선 신호"
           data-subtitle="첫 번째 기록"
           data-text="낯선 신호를 따라 처음으로 이곳에 도착했습니다.\n이곳에서 일어난 첫 번째 사건이 기록됩니다."
           data-unlock="처음부터 해금"
           data-image="forest">
        <div class="node-ornament"></div><div class="node-image"></div>
        <div class="node-name">1장 - 낯선 신호</div><div class="node-status">✓</div>
      </div>

      <!-- 2장 (현재) -->
      <div class="node current" data-x="650" style="left:650px;top:35%"
           data-name="2장 - 번칙 행성"
           data-condition="1장 클리어"
           data-title="2장 - 번칙 행성"
           data-subtitle="리젠트"
           data-text="왕은 이젠 거의 제대로 확인하지도 않은 채로, 현재 별자리의 행성 정보들을 획득 넘겨잡습니다.\n더 흥미로운 행성으로 향할 것을 명하노라!\n\n리젠트는 주먹으로 우주 관을 내려칩니다——\n*빅 빅* \n번칙 행성 발견!"
           data-unlock="1장을 클리어한 뒤 해금"
           data-image="planet">
        <div class="node-ornament"></div><div class="node-image"></div>
        <div class="node-name">2장 - 번칙 행성</div><div class="node-status">!</div>
      </div>

      <!-- 3장 -->
      <div class="node locked" data-x="1110" style="left:1110px;top:35%"
           data-name="3장 - 잊혀진 유적"
           data-condition="2장 클리어"
           data-title="3장 - 잊혀진 유적"
           data-subtitle="미해금 기록"
           data-text="고대 문명의 흔적이 남아있는 미지의 유적지입니다.\n풀리지 않은 수수께끼가 기다리고 있습니다."
           data-unlock="2장 클리어 후 해금"
           data-image="ruins">
        <div class="node-ornament"></div><div class="node-image"></div>
        <div class="node-name">3장 - 잊혀진 유적</div><div class="node-status">🔒</div>
      </div>

      <!-- 4장 -->
      <div class="node locked" data-x="1570" style="left:1570px;top:35%"
           data-name="4장 - 최후의 전장"
           data-condition="3장 클리어"
           data-title="4장 - 최후의 전장"
           data-subtitle="미해금 기록"
           data-text="과거 대전쟁이 벌어졌던 격전지입니다.\n황폐화된 대지 위로 긴장감이 감돕니다."
           data-unlock="3장 클리어 후 해금"
           data-image="battle">
        <div class="node-ornament"></div><div class="node-image"></div>
        <div class="node-name">4장 - 최후의 전장</div><div class="node-status">🔒</div>
      </div>

      <!-- 5장 -->
      <div class="node locked" data-x="2030" style="left:2030px;top:35%"
           data-name="5장 - 심해의 구렁텅이"
           data-condition="4장 클리어"
           data-title="5장 - 심해의 구렁텅이"
           data-subtitle="미해금 기록"
           data-text="빛이 닿지 않는 깊은 바다 속, 거대한 압력과 함께 알 수 없는 생명체의 울음소리가 들려옵니다."
           data-unlock="4장 클리어 후 해금"
           data-image="forest">
        <div class="node-ornament"></div><div class="node-image"></div>
        <div class="node-name">5장 - 심해의 구렁텅이</div><div class="node-status">🔒</div>
      </div>

      <!-- 6장 -->
      <div class="node locked" data-x="2490" style="left:2490px;top:35%"
           data-name="6장 - 네온 성운"
           data-condition="5장 클리어"
           data-title="6장 - 네온 성운"
           data-subtitle="미해금 기록"
           data-text="찬란한 빛의 가스가 소용돌이치는 우주의 정거장.\n화려한 자태 뒤로 위험한 전자기 폭풍이 도사리고 있습니다."
           data-unlock="5장 클리어 후 해금"
           data-image="planet">
        <div class="node-ornament"></div><div class="node-image"></div>
        <div class="node-name">6장 - 네온 성운</div><div class="node-status">🔒</div>
      </div>

      <!-- 7장 -->
      <div class="node locked" data-x="2950" style="left:2950px;top:35%"
           data-name="7장 - 얼어붙은 첨탑"
           data-condition="6장 클리어"
           data-title="7장 - 얼어붙은 첨탑"
           data-subtitle="미해금 기록"
           data-text="모든 것이 얼어붙은 설산의 정상.\n하늘을 찌를 듯 솟아오른 거대한 첨탑 안에서 고대 데이터가 발견됩니다."
           data-unlock="6장 클리어 후 해금"
           data-image="ruins">
        <div class="node-ornament"></div><div class="node-image"></div>
        <div class="node-name">7장 - 얼어붙은 첨탑</div><div class="node-status">🔒</div>
      </div>

      <!-- 8장 -->
      <div class="node locked" data-x="3410" style="left:3410px;top:35%"
           data-name="8장 - 차원의 균열"
           data-condition="7장 클리어"
           data-title="8장 - 차원의 균열"
           data-subtitle="미해금 기록"
           data-text="시공간이 뒤틀려 물리 법칙이 통하지 않는 균열 지대.\n이곳을 통과하면 새로운 진실에 다가가게 됩니다."
           data-unlock="7장 클리어 후 해금"
           data-image="battle">
        <div class="node-ornament"></div><div class="node-image"></div>
        <div class="node-name">8장 - 차원의 균열</div><div class="node-status">🔒</div>
      </div>

      <!-- 9장 -->
      <div class="node locked" data-x="3870" style="left:3870px;top:35%"
           data-name="9장 - 태초의 코어"
           data-condition="8장 클리어"
           data-title="9장 - 태초의 코어"
           data-subtitle="미해금 기록"
           data-text="모든 시스템의 근원이자 에너지가 응축된 중심부.\n수많은 비밀의 실타래가 비로소 풀리기 시작합니다."
           data-unlock="8장 클리어 후 해금"
           data-image="planet">
        <div class="node-ornament"></div><div class="node-image"></div>
        <div class="node-name">9장 - 태초의 코어</div><div class="node-status">🔒</div>
      </div>

      <!-- 10장 -->
      <div class="node locked" data-x="4330" style="left:4330px;top:35%"
           data-name="10장 - 새로운 여명"
           data-condition="9장 클리어"
           data-title="10장 - 새로운 여명"
           data-subtitle="최종 기록"
           data-text="모든 시련을 극복하고 맞이한 새로운 시작의 순간.\n역사의 새로운 장이 눈앞에 펼쳐집니다."
           data-unlock="9장 클리어 및 최종 보스 격파"
           data-image="ruins">
        <div class="node-ornament"></div><div class="node-image"></div>
        <div class="node-name">10장 - 새로운 여명</div><div class="node-status">🔒</div>

    </div>

    <button class="arrow left" id="leftBtn"><div class="arrow-shape"></div></button>
    <button class="arrow right" id="rightBtn"><div class="arrow-shape"></div></button>

</div>

<div class="tooltip" id="tooltip">
  <div class="tooltip-name"></div>
  <div class="tooltip-condition"></div>
  <div class="tooltip-status"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-subtitle" id="modalSubtitle"></div>
    <div class="modal-image" id="modalImage">
      <div class="modal-image-label">HISTORY RECORD</div>
    </div>
    <div class="modal-text" id="modalText"></div>
    <div class="unlock-box">
      <div class="unlock-label">🔒 해금 조건</div>
      <div id="modalUnlock"></div>
    </div>
    <button class="close-btn" id="closeBtn">닫기</button>
  </div>
</div>

<script>
(() => {
  const area=document.getElementById("timelineArea");
  const nodes=document.getElementById("nodes");
  const tooltip=document.getElementById("tooltip");
  const modal=document.getElementById("modalBackdrop");
  const nodeEls=[...document.querySelectorAll(".node")];
  const TRACK_WIDTH=4600; // 10개 노드에 맞춰 트랙 전체 너비 확장
  let offset=0,dragging=false,dragStartX=0,startOffset=0;

  function clamp(v){
    const min=Math.min(0,area.clientWidth-TRACK_WIDTH-100);
    return Math.max(min,Math.min(100,v));
  }
  function render(animated=false){
    nodes.style.transition=animated?"transform .25s cubic-bezier(0.25, 1, 0.5, 1)":"none";
    nodes.style.transform=`translateX(${offset}px)`;
  }
  function moveBy(v){offset=clamp(offset+v);render(true)}

  // 드래그 기능 구현 (Pointer Events)
  area.addEventListener("pointerdown",e=>{
    if(e.target.closest(".arrow")||e.target.closest(".node")) return;
    dragging=true;
    area.classList.add("dragging");
    dragStartX=e.clientX;
    startOffset=offset;
    area.setPointerCapture(e.pointerId);
    hideTooltip();
  });

  area.addEventListener("pointermove",e=>{
    if(!dragging)return;
    const dx=e.clientX-dragStartX;
    offset=clamp(startOffset+dx);
    render(false);
  });

  const stopDrag=(e)=>{
    if(!dragging)return;
    dragging=false;
    area.classList.remove("dragging");
    try{area.releasePointerCapture(e.pointerId);}catch(err){}
  };
  area.addEventListener("pointerup",stopDrag);
  area.addEventListener("pointercancel",stopDrag);

  // 마우스 휠 스크롤 지원
  area.addEventListener("wheel",e=>{
    e.preventDefault();
    moveBy(-e.deltaY||-e.deltaX);
  },{passive:false});

  // 좌우 화살표 버튼 이벤트 연결 (누를 때마다 이동 폭 확장)
  document.getElementById("leftBtn").onclick=()=>moveBy(500);
  document.getElementById("rightBtn").onclick=()=>moveBy(-500);

  function positionTooltip(e){
    const margin=14,r=tooltip.getBoundingClientRect();
    let x=e.clientX+16,y=e.clientY+16;
    if(x+r.width>innerWidth-margin)x=e.clientX-r.width-16;
    if(y+r.height>innerHeight-margin)y=e.clientY-r.height-16;
    tooltip.style.left=Math.max(margin,x)+"px";
    tooltip.style.top=Math.max(margin,y)+"px";
  }
  function hideTooltip(){tooltip.classList.remove("visible")}

  nodeEls.forEach(node=>{
    node.addEventListener("mouseenter",e=>{
      tooltip.querySelector(".tooltip-name").textContent=node.dataset.name;
      tooltip.querySelector(".tooltip-condition").textContent="해금 조건: "+node.dataset.condition;
      const s=tooltip.querySelector(".tooltip-status");
      const locked=node.classList.contains("locked");
      s.textContent=locked?"🔒 미해금":"✓ 해금됨";
      s.className="tooltip-status "+(locked?"locked":"unlocked");
      tooltip.classList.add("visible");positionTooltip(e);
    });
    node.addEventListener("mousemove",positionTooltip);
    node.addEventListener("mouseleave",hideTooltip);

    node.addEventListener("click",e=>{
      e.stopPropagation();
      const isLocked = node.classList.contains("locked");

      document.getElementById("modalTitle").textContent = node.dataset.title;

      const img=document.getElementById("modalImage");
      const type=node.dataset.image;
      if(type==="planet"){
        img.style.background="radial-gradient(circle at 70% 48%,#eefdf4 0 7%,#65d9b8 8% 15%,transparent 16%),radial-gradient(circle at 70% 48%,rgba(46,235,190,.42),transparent 28%),linear-gradient(125deg,#17271f 0 28%,#385548 29% 42%,#02152b 43% 72%,#453b22 73%)";
      }else if(type==="ruins"){
        img.style.background="linear-gradient(145deg,#26313a,#66676a 48%,#1b2028)";
      }else if(type==="battle"){
        img.style.background="radial-gradient(circle at 70% 40%,#d7b17b,transparent 12%),linear-gradient(120deg,#301c23,#7d3530 48%,#111522)";
      }else{
        img.style.background="radial-gradient(circle at 62% 38%,#69e6d0,transparent 15%),linear-gradient(120deg,#102f39,#194e5a 45%,#071523)";
      }

      if (isLocked) {
        // 미해금 노드일 경우: 스토리 대신 해금 조건 안내 표시
        document.getElementById("modalSubtitle").textContent = "🔒 잠긴 기록";
        document.getElementById("modalText").textContent = "이 기록은 아직 해금되지 않았습니다.\n아래의 해금 조건을 만족해 주세요.";
      } else {
        // 해금된 노드일 경우: 정상적으로 스토리 표시
        document.getElementById("modalSubtitle").textContent = node.dataset.subtitle;
        document.getElementById("modalText").textContent = node.dataset.text;
      }

      document.getElementById("modalUnlock").textContent = node.dataset.unlock;
      modal.classList.add("open");
      hideTooltip();
    });
  });

  function closeModal(){modal.classList.remove("open")}
  document.getElementById("closeBtn").onclick=closeModal;
  modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

  window.addEventListener("resize",()=>{offset=clamp(offset);render(false)});
  render(false);
})();
</script>
</body>
</html>
